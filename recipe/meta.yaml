{% set name = "asp-plot" %}
{% set version = "2.1.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/asp_plot-{{ version }}.tar.gz
  sha256: 2912ac221a6c63fd064b19035ccf5ec8202af0ad50bd62118f1fe1006c9f0cd1

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - asp_report = asp_plot.cli.asp_report:main
    - csm_camera_plot = asp_plot.cli.csm_camera_plot:main
    - stereo_geom = asp_plot.cli.stereo_geom:main
    - request_planetary_altimetry = asp_plot.cli.request_planetary_altimetry:main
    - gallery = asp_plot.cli.gallery:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - click
    - contextily
    - fpdf2
    - gdal
    - geopandas
    - matplotlib-base
    - matplotlib-scalebar
    - numpy
    - pandas
    - pyproj
    - rasterio
    - rioxarray
    - scipy
    - shapely
    - pyyaml
    - sliderule >=5.3.0
    - xarray

test:
  imports:
    - asp_plot
  commands:
    - asp_report --help
    - csm_camera_plot --help
    - stereo_geom --help
    - request_planetary_altimetry --help
    - gallery --help

about:
  home: https://github.com/uw-cryo/asp_plot
  summary: Package for plotting outputs of Ames Stereo Pipeline processing
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/uw-cryo/asp_plot

extra:
  recipe-maintainers:
    - bpurinton
